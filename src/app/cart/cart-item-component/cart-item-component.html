<p>cart-item-component works!</p>

<!-- <p>{{ cartItems$ | async | json }}</p> -->


<div class="cart-item">
  <img [src]="item.imageUrl" [alt]="item.title" class="product-image"> 

  <div class="product-details">
    <h3>{{ item.title }}</h3>
    <!-- <p>Price: {{ item.price | currency:'INR' }}</p> -->
     <p class="unit-price">
  Unit Price:
  {{ item.price | currency:'INR':'symbol':'1.0-0' }}
</p>

<p class="total-price">
  Total:
  <!-- {{ (item.price * item.quantity) | currency:'INR':'symbol':'1.0-0' }} -->
  {{ (item.price * item.quantity) | currency:'INR' }}
</p>
    <div class="qty-section">
      <button (click)="decreaseQty()">-</button>
      <span>{{ item.quantity }}</span>
      <button (click)="increaseQty()">+</button>
    </div>

    <button class="delete-btn" (click)="deleteItem()"> ❌ Remove </button>

  </div>

</div>
