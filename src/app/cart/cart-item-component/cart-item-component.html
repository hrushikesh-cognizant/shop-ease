<div class="cart-item" *ngIf="false">
  <img [src]="item.product.image" [alt]="item.product.name" class="product-image">

  <div class="product-details">
    <h3>{{ item.product.name }}</h3>
    <!-- <p>Price: {{ item.price | currency:'INR' }}</p> -->
    <p class="unit-price">
      Unit Price:
      {{ item.product.price | currency:'INR':'symbol':'1.0-0' }}
    </p>

    <p class="total-price">
      Total:
      <!-- {{ (item.product.price * item.quantity) | currency:'INR':'symbol':'1.0-0' }} -->
      {{ (item.product.price * item.quantity) | currency:'INR' }}
    </p>
    <!-- <div class="qty-section">
      <button (click)="decreaseQty()">-</button>
      <span>{{ item.quantity }}</span>
      <button (click)="increaseQty()">+</button>
    </div> -->

    <!-- <button class="delete-btn" (click)="deleteItem()"> ❌ Remove </button> -->

  </div>

</div>

<div class="cart-line">
  <img [src]="item.product.image" [alt]="item.product.name"/>
  <div class="flex-group-1">
    <strong>{{item.product.name}}</strong>
    <small class="d-block text-secondary">{{item.product.price | currency:'INR'}}</small>
  </div>

  <input
    name="quantity"
    class = "form-control form-control-sm qty"
    min="1"
    [max]="item.product.quantity"
    type="number"
    [value]="item.quantity"
    (change)="quantityChanged.emit(+$any($event.target).value)"
  />

  <strong> {{item.product.price * item.quantity | currency:'INR'}} </strong>

  <button 
    class="btn btn-link text-secondary p-0"
    (click)="removed.emit()"
  >
    ❌ Remove 
  </button> 

</div>
